# Fly.io deployment config — NestJS API
app = "unitree-shop-api"
primary_region = "cdg"  # Paris CDG — France-first MVP

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2  # Always 2 for HA; scales to 10 under load

  [http_service.concurrency]
    type = "requests"
    soft_limit = 250
    hard_limit = 300

[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 1024

# Health check — NestJS exposes /api/health
[[services.tcp_checks]]
  grace_period = "10s"
  interval = "15s"
  restart_limit = 3
  timeout = "2s"

