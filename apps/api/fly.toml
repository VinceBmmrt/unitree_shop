# Fly.io deployment config — NestJS API
app = "unitree-shop-api"
primary_region = "cdg"  # Paris CDG — France-first MVP

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 250
    hard_limit = 300

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Scale up when ready:
#   fly scale vm performance-2x --app unitree-shop-api
#   fly scale count 2 --app unitree-shop-api
